<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Lab Coat Gradient -->
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Scrub Shirt Gradient -->
    <linearGradient id="scrubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Badge Header Gradient -->
    <linearGradient id="badgeHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="badgeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="506" height="506" x="3" y="3" rx="112" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />

  <!-- Inner Scrub Shirt (V-neck) -->
  <path d="M 180 140 L 332 140 L 332 300 L 256 360 L 180 300 Z" fill="url(#scrubGrad)" />
  <path d="M 210 140 L 256 220 L 302 140 Z" fill="#0369a1" opacity="0.4" />

  <!-- Doctor Coat (Shoulders & Body) -->
  <g filter="url(#shadow)">
    <!-- Base Coat Silhouette -->
    <path d="M 76 512 L 76 340 C 76 230 140 160 210 140 L 256 230 L 302 140 C 372 160 436 230 436 340 L 436 512 Z" fill="url(#coatGrad)" />
    
    <!-- Left Coat Flap / Lapel -->
    <path d="M 76 512 L 76 340 C 76 230 140 160 210 140 L 250 250 L 220 512 Z" fill="#ffffff" />
    <path d="M 210 140 L 250 250 L 195 240 Z" fill="#f1f5f9" />

    <!-- Right Coat Flap / Lapel (overlapping) -->
    <path d="M 436 512 L 436 340 C 436 230 372 160 302 140 L 245 270 L 248 512 Z" fill="#f8fafc" />
    <path d="M 302 140 L 245 270 L 315 240 Z" fill="#e2e8f0" />
    
    <!-- Coat Center Seam & Buttons -->
    <line x1="248" y1="270" x2="248" y2="512" stroke="#cbd5e1" stroke-width="3" />
    <circle cx="248" cy="350" r="7" fill="#94a3b8" />
    <circle cx="248" cy="430" r="7" fill="#94a3b8" />
  </g>

  <!-- Stethoscope hanging around neck -->
  <g filter="url(#shadow)">
    <!-- Left tube -->
    <path d="M 175 140 C 145 200 135 290 155 350 C 165 380 185 390 195 365 L 180 320" fill="none" stroke="#334155" stroke-width="14" stroke-linecap="round" />
    <!-- Right tube with bell -->
    <path d="M 337 140 C 367 200 375 290 355 370 C 345 410 315 425 295 400" fill="none" stroke="#334155" stroke-width="14" stroke-linecap="round" />
    <!-- Stethoscope Chest Piece / Bell -->
    <circle cx="290" cy="395" r="22" fill="#0f172a" stroke="#64748b" stroke-width="7" />
    <circle cx="290" cy="395" r="9" fill="#38bdf8" />
  </g>

  <!-- NAME TAG PINNED ON THE COAT -->
  <g filter="url(#badgeShadow)">
    <!-- Badge Clip / Pin -->
    <rect x="135" y="222" width="26" height="14" rx="4" fill="#94a3b8" />
    <rect x="140" y="216" width="16" height="10" rx="3" fill="#64748b" />
    <line x1="148" y1="222" x2="148" y2="236" stroke="#475569" stroke-width="2" />

    <!-- Name Badge Card -->
    <rect x="98" y="232" width="100" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5" />
    
    <!-- Top Blue Header on Badge -->
    <path d="M 100 234 Q 100 234 100 242 L 100 250 L 196 250 L 196 242 Q 196 234 196 234 Z" fill="url(#badgeHeader)" />
    
    <!-- Little avatar circle on badge -->
    <circle cx="116" cy="270" r="10" fill="#e0e7ff" />
    <circle cx="116" cy="268" r="4.5" fill="#4f46e5" />
    <path d="M 109 278 C 109 274 113 273 116 273 C 119 273 123 274 123 278 Z" fill="#4f46e5" />

    <!-- NAME TAG TEXT: "OXY" -->
    <text x="160" y="277" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">Oxy</text>
  </g>
</svg>